[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "xpkgindex"
version = "0.2.0"
description = "Static site framework for package indexes — core + ecosystem plugins"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "jinja2>=3.0",
    "lupa>=2.0",
    "markdown-it-py>=3.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
xpkgindex = "xpkgindex.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["xpkgindex*"]

[tool.setuptools.package-data]
xpkgindex = ["templates/**/*.html", "templates/**/*.xml", "static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
